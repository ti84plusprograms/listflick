appId: com.listingassistant.app
name: Configure an AI provider without a real key
tags:
  - local
  - ai-settings
---
- stopApp
- launchApp:
    clearState: false
    permissions:
      all: allow

- runFlow: helpers/ensure-authenticated.yaml

# The development-only bootstrap preserves authentication while clearing only
# the selected AI provider and provider keys for this signed-in E2E account.
- assertVisible:
    id: home-screen
- tapOn: "Settings, tab, .*"
- assertVisible:
    id: settings-screen
- extendedWaitUntil:
    visible:
      id: settings-ai-ready
    timeout: 10000
- scrollUntilVisible:
    element:
      id: settings-ai-provider
    direction: DOWN
    centerElement: true

# First use is provider-neutral: no provider-specific key row is shown.
- assertVisible:
    id: settings-ai-provider
    text: "AI Provider, Choose"
- assertNotVisible: "Gemini API Key"
- assertNotVisible: "Groq API Key"

# Both supported providers are explicit choices. Select Groq to prove the app
# does not silently substitute the backend's Gemini default.
- tapOn:
    id: settings-ai-provider
- assertVisible: "Choose AI Provider"
- assertVisible:
    id: settings-provider-gemini
- assertVisible:
    id: settings-provider-groq
- tapOn:
    id: settings-provider-groq

# First selection asks only for the selected provider's key. Do not enter or
# save a fake secret: the missing-key path is the behavior under test.
- assertVisible: "Groq API Key"
- assertVisible:
    id: settings-provider-key-input
- assertNotVisible: "Gemini API Key"
- tapOn:
    id: settings-provider-key-close
- assertVisible:
    id: settings-ai-provider
    text: "AI Provider, Groq"
- assertVisible:
    id: settings-provider-key
    text: "Groq API Key, Not saved"
- assertNotVisible: "Gemini API Key"

# Exercise the normal product preflight. It must block before creating an item
# or starting analysis and show selected-provider-specific guidance.
- tapOn: "Home, tab, .*"
- assertVisible:
    id: home-screen
- tapOn:
    id: home-choose-from-library
- assertVisible: "Groq API key required"
- assertVisible: "Add API Key"
- assertNotVisible: "Gemini API key required"
- tapOn: "Add API Key"
- extendedWaitUntil:
    visible:
      id: settings-provider-key-input
    timeout: 10000
- assertVisible: "Groq API Key"
- assertVisible:
    id: settings-provider-key-input
- tapOn:
    id: settings-provider-key-close

# Restart once to prove the guarded bootstrap restores the neutral state for
# the next run without deleting Firebase authentication.
- stopApp
- launchApp:
    clearState: false
    permissions:
      all: allow
- tapOn: "Settings, tab, .*"
- extendedWaitUntil:
    visible:
      id: settings-ai-ready
    timeout: 10000
- scrollUntilVisible:
    element:
      id: settings-ai-provider
    direction: DOWN
    centerElement: true
- assertVisible:
    id: settings-ai-provider
    text: "AI Provider, Choose"
- assertNotVisible: "Gemini API Key"
- assertNotVisible: "Groq API Key"
