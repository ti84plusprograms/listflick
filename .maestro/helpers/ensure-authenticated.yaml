appId: com.listingassistant.app
---
# 1. If the app starts on the unauthenticated login screen, automatically sign in
# using deterministic test credentials.
- runFlow:
    when:
      visible:
        id: "login-screen"
    commands:
      - runFlow:
          when:
            visible: "^Create Account$"
          commands:
            - tapOn:
                id: "auth-toggle-mode-button"
      - tapOn:
          id: "auth-email-input"
      - inputText: "onboarding-test@listflick.test"
      - tapOn:
          id: "auth-password-input"
      # Simulated E2E auth ignores this non-secret sentinel; it is not an account password.
      - inputText: "local-e2e-only"
      - tapOn: "Welcome to.*"
      - tapOn:
          id: "auth-submit-button"
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"

# 2. Ensure active tab is Home if previously left on Settings or Inventory
- runFlow:
    when:
      visible:
        id: "settings-screen"
    commands:
      - tapOn: "Home, tab, .*"

- runFlow:
    when:
      visible:
        id: "inventory-screen"
    commands:
      - tapOn: "Home, tab, .*"

# 3. Verify home screen and data readiness
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "home-data-ready"
    timeout: 10000
