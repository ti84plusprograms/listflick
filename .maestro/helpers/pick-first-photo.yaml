appId: com.listingassistant.app
---
# Native media pickers do not expose application test IDs. These semantic
# selectors follow Maestro's cross-version gallery recipe.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "com.google.android.providers.media.module:id/icon_thumbnail"
          index: 0
          optional: true
      - tapOn:
          id: "com.google.android.documentsui:id/thumbnail"
          index: 0
          optional: true

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "PXGGridLayout-Info"
          index: 0

- tapOn:
    text: "^Add( \\([0-9]+\\))?$"
    optional: true
- tapOn:
    text: "^Done$"
    optional: true
- tapOn:
    text: "^Select$"
    optional: true
