appId: com.listingassistant.app
---
# Select the second seeded fixture. The seed script adds both repository-owned
# camera photos together and marks that fixture-set version in the simulator.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "com.google.android.providers.media.module:id/icon_thumbnail"
          index: 1
          optional: true
      - tapOn:
          id: "com.google.android.documentsui:id/thumbnail"
          index: 1
          optional: true

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "PXGGridLayout-Info"
          index: 1

- tapOn:
    text: "^Add( \\([0-9]+\\))?$"
    optional: true
- tapOn:
    text: "^Done$"
    optional: true
- tapOn:
    text: "^Select$"
    optional: true
