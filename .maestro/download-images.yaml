appId: com.listingassistant.app
name: Download server-backed listing images to camera roll
tags:
  - local
  - image-download
---
- stopApp
- launchApp:
    clearState: false
    permissions:
      all: allow

- runFlow: helpers/ensure-authenticated.yaml

- assertVisible:
    id: home-screen
- extendedWaitUntil:
    visible:
      id: home-data-ready
    timeout: 10000

# 1. Clean up any stale fixture listings from interrupted prior runs
- tapOn: "Inventory, tab, .*"
- assertVisible:
    id: inventory-screen
- repeat:
    times: 3
    while:
      visible: "Open Vintage Canon Camera listing.*"
    commands:
      - tapOn: "^Remove Vintage Canon Camera from inventory$"
      - tapOn: "Remove"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: inventory-recently-deleted
    commands:
      - tapOn:
          id: inventory-recently-deleted
      - repeat:
          times: 3
          while:
            visible: "Vintage Canon Camera"
          commands:
            - tapOn: "Permanently delete Vintage Canon Camera"
            - tapOn:
                text: "^Delete Permanently$"
                index: 1
            - waitForAnimationToEnd
      - tapOn:
          id: recently-deleted-back

# 2. Return home and discard any dangling draft
- tapOn: "Home, tab, .*"
- assertVisible:
    id: home-screen
- extendedWaitUntil:
    visible:
      id: home-data-ready
    timeout: 10000
- runFlow:
    when:
      visible: ".*Resume listing.*"
    commands:
      - tapOn: ".*Resume listing.*"
      - runFlow:
          when:
            visible: "Discard Listing"
          commands:
            - tapOn: "Discard Listing"
            - tapOn: "^Discard$"
      - runFlow:
          when:
            notVisible:
              id: home-screen
          commands:
            - extendedWaitUntil:
                visible:
                  id: review-screen
                timeout: 15000
            - tapOn:
                id: review-more-actions
            - tapOn:
                id: review-discard-listing
            - tapOn: "^Discard$"
      - extendedWaitUntil:
          visible:
            id: home-screen
          timeout: 10000

# 3. Create a deterministic listing using the seeded fixture photo
- tapOn:
    id: home-choose-from-library
- runFlow: helpers/pick-first-photo.yaml
- assertVisible:
    id: selected-photo-count
    text: "1 selected photo"
- tapOn:
    id: camera-next
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: processing-screen
- extendedWaitUntil:
    visible:
      id: review-screen
    timeout: 15000
- assertVisible:
    id: review-listing-title
    text: "Vintage Canon Camera"

# 4. Save listing to inventory to establish server-backed image URLs
- tapOn:
    id: review-save-to-inventory
- assertVisible: "Saved"
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: inventory-screen
    timeout: 10000

# 5. Open the saved listing from Inventory
- tapOn: "Open Vintage Canon Camera listing.*"
- extendedWaitUntil:
    visible:
      id: review-screen
    timeout: 15000
- assertVisible:
    id: review-listing-title
    text: "Vintage Canon Camera"

# 6. Record Photos library state before download
- launchApp:
    appId: "com.apple.mobileslideshow"
- extendedWaitUntil:
    visible:
      id: "PXCuratedLibraryUIView"
    timeout: 10000
- takeScreenshot: "photos-before-download"
- launchApp:
    appId: "com.listingassistant.app"
    stopApp: false
- extendedWaitUntil:
    visible:
      id: review-screen
    timeout: 10000

# 7. Trigger image download from overflow menu
- tapOn:
    id: review-more-actions
- assertVisible:
    id: review-save-photos
- tapOn:
    id: review-save-photos

# 8. Assert completion alert and dismiss
- extendedWaitUntil:
    visible: "Saved"
    timeout: 15000
- assertVisible: "Saved 1 photo to your camera roll."
- tapOn: "OK"

# 9. Verify downloaded photo in Photos app and record after state
- launchApp:
    appId: "com.apple.mobileslideshow"
- extendedWaitUntil:
    visible:
      id: "PXCuratedLibraryUIView"
    timeout: 10000
- takeScreenshot: "photos-after-download"
- launchApp:
    appId: "com.listingassistant.app"
    stopApp: false
- extendedWaitUntil:
    visible:
      id: review-screen
    timeout: 10000

# 10. Confirm listing remains intact and usable, then clean up
- assertVisible:
    id: review-listing-title
    text: "Vintage Canon Camera"
- tapOn:
    id: review-back
- assertVisible:
    id: inventory-screen

# Clean up saved inventory listing to ensure idempotency
- tapOn: "^Remove Vintage Canon Camera from inventory$"
- tapOn: "Remove"
- tapOn:
    id: inventory-recently-deleted
- tapOn: "Permanently delete Vintage Canon Camera"
- tapOn:
    text: "^Delete Permanently$"
    index: 1
- tapOn:
    id: recently-deleted-back
