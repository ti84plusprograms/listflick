appId: com.listingassistant.app
name: Improve a deterministic listing with AI
tags:
  - local
  - ai-improvement
---
- stopApp
- launchApp:
    clearState: false
    permissions:
      all: allow

- runFlow: helpers/ensure-authenticated.yaml

- assertVisible:
    id: home-screen
- extendedWaitUntil:
    visible:
      id: home-data-ready
    timeout: 10000

# Remove only a saved copy from an interrupted run of this fixture flow.
- tapOn: "Inventory, tab, .*"
- assertVisible:
    id: inventory-screen
- repeat:
    times: 3
    while:
      visible: "Open Vintage Canon (AE-1 )?35mm Film Camera listing.*"
    commands:
      - tapOn: "^Remove Vintage Canon (AE-1 )?35mm Film Camera from inventory$"
      - tapOn: "Remove"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: inventory-recently-deleted
    commands:
      - tapOn:
          id: inventory-recently-deleted
      - assertVisible:
          id: recently-deleted-screen
      - repeat:
          times: 3
          while:
            visible: "Vintage Canon (AE-1 )?35mm Film Camera"
          commands:
            - tapOn: "Permanently delete Vintage Canon (AE-1 )?35mm Film Camera"
            - tapOn:
                text: "^Delete Permanently$"
                index: 1
            - waitForAnimationToEnd
      - tapOn:
          id: recently-deleted-back

# Enable the existing customer-facing suggestion UI through Settings. The
# conditional keeps repeated runs deterministic when a prior run left it on.
- tapOn: "Settings, tab, .*"
- assertVisible:
    id: settings-screen
- extendedWaitUntil:
    visible:
      id: settings-ai-ready
    timeout: 10000
- scrollUntilVisible:
    element:
      id: settings-ai-photo-insights
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      visible: "^AI Photo Insights, Off$"
    commands:
      - tapOn: "^AI Photo Insights, Off$"
- assertVisible: "^AI Photo Insights, On$"

- tapOn: "Home, tab, .*"
- assertVisible:
    id: home-screen
- extendedWaitUntil:
    visible:
      id: home-data-ready
    timeout: 10000

# Discard only the dedicated account's unfinished fixture draft.
- runFlow:
    when:
      visible: ".*Resume listing.*"
    commands:
      - tapOn: ".*Resume listing.*"
      - extendedWaitUntil:
          visible:
            id: review-screen
          timeout: 15000
      - tapOn:
          id: review-more-actions
      - tapOn:
          id: review-discard-listing
      - tapOn: "^Discard$"
      - extendedWaitUntil:
          visible:
            id: home-screen
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: home-data-ready
          timeout: 10000

# Create the draft through the same picker, analysis, and Processing UI used by
# a real user. The E2E backend supplies deterministic listing and improvement data.
- tapOn:
    id: home-choose-from-library
- runFlow: helpers/pick-first-photo.yaml
- assertVisible:
    id: selected-photo-count
    text: "1 selected photo"
- tapOn:
    id: camera-next
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: processing-screen
- extendedWaitUntil:
    visible:
      id: review-screen
    timeout: 15000
- assertVisible:
    id: review-listing-title
    text: "Vintage Canon Camera"

# Use the real Edit Listing suggestion and verify its result in place. The AI
# fills Brand / Model and reports every changed field, so the improvement is
# visible without scrolling away and back to compare the title.
- tapOn:
    id: review-edit-listing
- assertVisible:
    id: edit-listing-screen
- scrollUntilVisible:
    element:
      id: edit-listing-brand-model
    direction: DOWN
    centerElement: true
- assertVisible:
    id: edit-listing-buyer-trust-suggestion
- tapOn:
    id: edit-listing-apply-buyer-trust
- extendedWaitUntil:
    visible:
      id: edit-listing-brand-model
      text: "Canon AE-1"
    timeout: 10000
- assertVisible:
    id: edit-listing-improvement-summary
    text: "AI updated Brand / Model, title, and description."
- assertNotVisible:
    id: edit-listing-buyer-trust-suggestion
- tapOn:
    id: edit-listing-save

- assertVisible:
    id: review-screen
- assertVisible:
    id: review-listing-title
    text: "Vintage Canon AE-1 35mm Film Camera"
- assertVisible:
    id: review-listing-description
    text: "(?s).*Brand/model: Canon AE-1.*"

# Save, reopen, and verify the improved result persisted before removing only
# this fixture listing and its local backend item/image.
- tapOn:
    id: review-save-to-inventory
- assertVisible: "Saved"
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: inventory-screen
    timeout: 10000
- assertVisible: "Open Vintage Canon AE-1 35mm Film Camera listing, \\$125, Ready to list"
- tapOn: "Open Vintage Canon AE-1 35mm Film Camera listing, \\$125, Ready to list"
- assertVisible:
    id: review-listing-title
    text: "Vintage Canon AE-1 35mm Film Camera"
- assertVisible:
    id: review-listing-description
    text: "(?s).*Brand/model: Canon AE-1.*"
- tapOn:
    id: review-back
- tapOn: "^Remove Vintage Canon AE-1 35mm Film Camera from inventory$"
- tapOn: "Remove"
- assertNotVisible: "Open Vintage Canon AE-1 35mm Film Camera listing.*"
- tapOn:
    id: inventory-recently-deleted
- tapOn: "Permanently delete Vintage Canon AE-1 35mm Film Camera"
- tapOn:
    text: "^Delete Permanently$"
    index: 1
- assertNotVisible: "Vintage Canon AE-1 35mm Film Camera"
- tapOn:
    id: recently-deleted-back
- assertVisible:
    id: inventory-screen
