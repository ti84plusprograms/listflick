appId: com.listingassistant.app
name: Add, view, remove, and save listing photos
tags:
  - local
  - photo-management
---
- stopApp
- launchApp:
    clearState: false
    permissions:
      all: allow

- runFlow: helpers/ensure-authenticated.yaml

- assertVisible:
    id: home-screen
- extendedWaitUntil:
    visible:
      id: home-data-ready
    timeout: 10000

# Remove only a saved copy from an interrupted run of this fixture flow.
- tapOn: "Inventory, tab, .*"
- assertVisible:
    id: inventory-screen
- repeat:
    times: 3
    while:
      visible: "Open Vintage Canon Camera listing.*"
    commands:
      - tapOn: "^Remove Vintage Canon Camera from inventory$"
      - tapOn: "Remove"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: inventory-recently-deleted
    commands:
      - tapOn:
          id: inventory-recently-deleted
      - assertVisible:
          id: recently-deleted-screen
      - repeat:
          times: 3
          while:
            visible: "Vintage Canon Camera"
          commands:
            - tapOn: "Permanently delete Vintage Canon Camera"
            - tapOn:
                text: "^Delete Permanently$"
                index: 1
            - waitForAnimationToEnd
      - tapOn:
          id: recently-deleted-back

- tapOn: "Home, tab, .*"
- assertVisible:
    id: home-screen
- extendedWaitUntil:
    visible:
      id: home-data-ready
    timeout: 10000

# A failed prior run can leave the dedicated E2E account with a fixture draft.
- runFlow:
    when:
      visible: ".*Resume listing.*"
    commands:
      - tapOn: ".*Resume listing.*"
      - extendedWaitUntil:
          visible:
            id: review-screen
          timeout: 15000
      - tapOn:
          id: review-more-actions
      - tapOn:
          id: review-discard-listing
      - tapOn: "^Discard$"
      - extendedWaitUntil:
          visible:
            id: home-screen
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: home-data-ready
          timeout: 10000

# Create the deterministic draft through the normal listing UI.
- tapOn:
    id: home-choose-from-library
- runFlow: helpers/pick-first-photo.yaml
- assertVisible:
    id: selected-photo-count
    text: "1 selected photo"
- tapOn:
    id: camera-next
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: processing-screen
- extendedWaitUntil:
    visible:
      id: review-screen
    timeout: 15000
- assertVisible:
    id: review-listing-title
    text: "Vintage Canon Camera"

# Add the repository-owned second camera angle from the seeded photo library.
- tapOn:
    id: review-manage-photos
- assertVisible:
    id: manage-photos-screen
- assertVisible: "Open photo 1 of 1"
- tapOn:
    id: manage-photos-add
- runFlow: helpers/pick-second-photo.yaml
- extendedWaitUntil:
    visible: "Open photo 1 of 2"
    timeout: 10000
- assertVisible: "Open photo 2 of 2"
- assertVisible: "Tap a photo to view it. Hold and drag to reorder.*"

# Exercise the customer-visible photo viewer and its semantic navigation.
- tapOn: "Open photo 1 of 2"
- assertVisible:
    id: photo-viewer
- assertVisible: "Photo 1 of 2"
- tapOn:
    id: photo-viewer-next
- assertVisible: "Photo 2 of 2"
- tapOn:
    id: photo-viewer-close
- assertVisible:
    id: manage-photos-screen

# Remove one copy, prove the app protects the last remaining photo, and persist
# the one-photo result through the real replacement endpoint.
- tapOn: "Remove photo 1"
- assertVisible: "Open photo 1 of 1"
- assertNotVisible: "Open photo 2 of 2"
- tapOn: "Remove photo 1"
- assertVisible: "Photo required"
- assertVisible: "A listing must keep at least one photo."
- tapOn: "OK"
- assertVisible: "Open photo 1 of 1"
- tapOn:
    id: manage-photos-done
- extendedWaitUntil:
    visible:
      id: review-screen
    timeout: 15000

# Reopen Manage Photos to prove the saved photo set remains in the listing
# workspace, then save the listing and verify normal Inventory navigation.
- tapOn:
    id: review-manage-photos
- assertVisible:
    id: manage-photos-screen
- assertVisible: "Open photo 1 of 1"
- assertNotVisible: "Open photo 2 of 2"
- tapOn:
    id: manage-photos-done
- extendedWaitUntil:
    visible:
      id: review-screen
    timeout: 15000
- tapOn:
    id: review-save-to-inventory
- assertVisible: "Saved"
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: inventory-screen
    timeout: 10000
- assertVisible: "Open Vintage Canon Camera listing, \\$125, Ready to list"

# Successful runs leave neither the local listing nor its backend item/image.
- tapOn: "^Remove Vintage Canon Camera from inventory$"
- tapOn: "Remove"
- assertNotVisible: "Open Vintage Canon Camera listing.*"
- tapOn:
    id: inventory-recently-deleted
- tapOn: "Permanently delete Vintage Canon Camera"
- tapOn:
    text: "^Delete Permanently$"
    index: 1
- assertNotVisible: "Vintage Canon Camera"
- tapOn:
    id: recently-deleted-back
- assertVisible:
    id: inventory-screen
